services:
  app:
    image: git.ombrage.space/orochibraru/homerun:${HOMERUN_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homerun}:${POSTGRES_PASSWORD:-homerun}@postgres:5432/${POSTGRES_DB:-homerun}
      DOCKER_NETWORK_NAME: homerun
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env before starting, e.g. openssl rand -hex 32 or bunx auth secret}
    extends:
      file: tools/compose/app.compose.yml
      service: app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homerun
      - internal

  traefik:
    extends:
      file: tools/compose/base.compose.yaml
      service: traefik
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homerun
      - internal

  postgres:
    extends:
      file: tools/compose/base.compose.yaml
      service: postgres
    networks:
      - internal

networks:
  homerun:
    name: homerun
    external: true
  internal:
    external: false

volumes:
  postgres_data: {}
  traefik_certs: {}
  homerun_data: {}
