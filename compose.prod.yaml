services:
  app:
    image: docker.io/orochibraru/homerun:${HOMERUN_VERSION:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homerun}:${POSTGRES_PASSWORD:-homerun}@postgres:5432/${POSTGRES_DB:-homerun}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env before starting, e.g. openssl rand -hex 32 or bunx auth secret}
    volumes:
      - ./homerun.yaml:/app/homerun.yaml:ro
    extends:
      file: tools/compose/app.compose.yaml
      service: app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homerun
      - internal

  traefik:
    extends:
      file: tools/compose/base.compose.yaml
      service: traefik
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homerun
      - internal

  postgres:
    extends:
      file: tools/compose/base.compose.yaml
      service: postgres
    networks:
      - internal

networks:
  homerun:
    name: homerun
    external: true
  internal:
    external: false

volumes:
  postgres_data: {}
  traefik_certs: {}
  app_data: {}
