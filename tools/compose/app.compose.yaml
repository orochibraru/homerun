services:
  app:
    restart: unless-stopped
    # Docker's own default is 10s before SIGKILL, which is shorter than the
    # adapter's own graceful-shutdown window (SHUTDOWN_TIMEOUT, 30s default,
    # see @orochibraru/svelte-smol) : without this, `docker stop` would kill
    # the process mid-drain before it ever got the chance to finish
    # gracefully, real requests (a live log stream, an in-progress deploy
    # poll) would still get cut regardless of that adapter fix.
    stop_grace_period: 35s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homerun.rule=Host(`${DASHBOARD_DOMAIN:-localhost}`)"
      - "traefik.http.routers.homerun.entrypoints=${DASHBOARD_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.homerun.tls=true"
      - "traefik.http.routers.homerun.tls.certresolver=${DASHBOARD_DOMAIN:+${DASHBOARD_CERT_RESOLVER:-letsencrypt}}"
      - "traefik.http.services.homerun.loadbalancer.server.port=3000"
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app_data:/app/data
      - traefik_dynamic:/app/traefik-dynamic
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-homerun}:${POSTGRES_PASSWORD:-homerun}@postgres:5432/${POSTGRES_DB:-homerun}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env before starting, e.g. openssl rand -hex 32 or bunx auth secret}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 5s
      # The svelte-smol adapter ships a self-contained probe binary that hits
      # GET /_health over loopback, matching the Dockerfile's own HEALTHCHECK.
      test: ["CMD", "/app/build/healthcheck"]
      timeout: 30s
