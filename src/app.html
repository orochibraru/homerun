<!doctype html>
<html data-surface="%homerun.surface%" lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			content="width=device-width, initial-scale=1, viewport-fit=cover"
			name="viewport"
		/>
		<meta content="scale" name="text-scale" />
		<link
			href="%sveltekit.assets%/favicon.svg"
			rel="icon"
			type="image/svg+xml"
		/>
		<link href="%sveltekit.assets%/manifest.webmanifest" rel="manifest" />
		<link
			href="%sveltekit.assets%/icons/apple-touch-icon.png"
			rel="apple-touch-icon"
		/>
		<meta
			content="#ffffff"
			media="(prefers-color-scheme: light)"
			name="theme-color"
		/>
		<meta
			content="#0a0a0c"
			media="(prefers-color-scheme: dark)"
			name="theme-color"
		/>
		<meta content="yes" name="mobile-web-app-capable" />
		<meta content="Homerun" name="apple-mobile-web-app-title" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
