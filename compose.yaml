services:
  traefik:
    extends:
      file: tools/compose/base.compose.yaml
      service: traefik
    volumes:
      - ./traefik-dynamic:/etc/traefik/dynamic
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homerun
      - internal

  agent:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: agent
    extends:
      file: tools/compose/agent.compose.yaml
      service: agent
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - homerun

  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: ./Dockerfile
      target: app
    extends:
      file: tools/compose/worker.compose.yaml
      service: worker
    # Published here and nowhere else: in this file the app runs on the host
    # (bun run dev), so it reaches the control API over localhost rather than
    # the compose network. Every other compose file keeps the port on the
    # internal network, where only the app container needs it.
    ports:
      - "${WORKER_PORT:-7430}:${WORKER_PORT:-7430}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - homerun

  postgres:
    extends:
      file: tools/compose/base.compose.yaml
      service: postgres
    networks:
      - internal

networks:
  homerun:
    name: homerun
    external: true
  internal:
    external: false

volumes:
  postgres_data: {}
  traefik_certs: {}
  agent_data: {}
