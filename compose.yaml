services:
  traefik:
    extends:
      file: tools/compose/base.compose.yaml
      service: traefik
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homerun
      - internal

  postgres:
    extends:
      file: tools/compose/base.compose.yaml
      service: postgres
    networks:
      - internal

networks:
  homerun:
    name: homerun
    external: true
  internal:
    external: false

volumes:
  postgres_data: {}
  traefik_certs: {}
