# Run by prek (https://github.com/j178/prek), a drop-in pre-commit runner.
# Install the hooks once with `prek install -t pre-commit -t commit-msg`;
# `bun install` does it for you.
repos:
  # Cheap, generic hygiene the language tooling below does not cover: biome
  # owns the code files and prettier the markdown, but nothing was looking at
  # YAML, the Dockerfile, .editorconfig or a stray conflict marker.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
        # A false positive, not a real secret: the custom SSL cert form's
        # `<textarea>` placeholder text spells out the PEM header a real key
        # would start with. The hook does a bare marker substring match with
        # no way to tell the two apart.
        exclude: ^src/routes/\(protected\)/services/\[serviceId\]/networking/\+page\.svelte$
      - id: check-yaml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: &generated |-
          (?x)^(
            openapi\.json|
            homerun\.schema\.json|
            homerun\.example\.yaml|
            packages/cli/generated/|
            CHANGELOG\.md|
            bun\.lock|
            drizzle/
          )
      - id: end-of-file-fixer
        # Machine-generated/vendored files: reformatting them makes the next
        # `bun run gen`/`db:generate`/release diff our own whitespace forever.
        exclude: *generated
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *generated

  # semantic-release computes the next version from the commit messages (see
  # CLAUDE.md's Release automation section), so a malformed subject silently
  # costs a release rather than failing loudly.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Secrets are introduced at commit time, which is exactly where this runs.
  # Note it scans the *staged* diff, so it is a no-op under `--all-files` in
  # CI: GitHub's own push protection is the second line, not this hook.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        # Report, do not rewrite. The upstream hook defaults to
        # --write-changes, and an unattended "fix" to an identifier is worse
        # than the typo it corrects.
        args: [--force-exclude]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # The Docker image, not the system binary: CI runners have a daemon but no
  # hadolint on PATH. Rule exemptions and their reasons are in `.hadolint.yaml`.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      # Runs first: openapi.json, the CLI's generated types and the config JSON
      # schema are derived from source that may itself be part of this commit.
      - id: gen
        name: regenerate openapi spec + derived types
        entry: bun run gen
        language: system
        pass_filenames: false
        files: ^(src/lib/openapi/|src/lib/server/validation/|src/lib/config\.ts$|scripts/generate-)

      - id: biome
        name: biome check --write --unsafe
        entry: bunx biome check --write --unsafe --no-errors-on-unmatched
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css|svelte|html)$

      - id: prettier-md
        name: prettier (markdown)
        entry: bunx prettier --log-level warn --write
        language: system
        types: [markdown]

      - id: markdownlint
        name: markdownlint-cli2 --fix
        entry: bunx markdownlint-cli2 --fix
        language: system
        types: [markdown]

      # tailwint discards explicit file arguments (verified: any path/glob form
      # reports "0 files scanned"), so it always scans the whole repo. Only the
      # decision to run it at all is staged-scoped.
      - id: tailwint
        name: tailwint --fix
        entry: bunx tailwint --fix
        language: system
        pass_filenames: false
        files: \.(tsx|jsx|html|vue|svelte|astro|mdx|css)$

      # `bun.lock` drifting from `package.json` (a manual edit, a bad merge)
      # is otherwise only caught by CI's own `--frozen-lockfile` install,
      # after the commit already happened.
      - id: lockfile-in-sync
        name: bun.lock matches package.json
        entry: bun install --frozen-lockfile --dry-run
        language: system
        pass_filenames: false
        files: ^(package\.json|bun\.lock)$

      # A cheap unit suite (~200 tests, ~2s locally) is worth running before
      # the commit rather than after the push.
      - id: test-unit
        name: bun test (unit)
        entry: bun run test:unit
        language: system
        pass_filenames: false
        files: ^(src/|packages/agent/|packages/cli/|packages/installer/|tests/unit/|bunfig\.toml$)

      # Type checks last, after the fixers have had their turn. Each one is
      # whole-project by nature (a change in one file can break the types of a
      # file it imports), so the staged paths only decide whether a project is
      # worth checking at all, never what gets checked.
      - id: check-app
        name: svelte-check (app)
        entry: bun run check:app
        language: system
        pass_filenames: false
        files: ^(src/|vite\.config\.ts$|tsconfig\.json$)

      - id: check-agent
        name: tsc (packages/agent)
        entry: bun run check:agent
        language: system
        pass_filenames: false
        files: ^packages/agent/

      - id: check-cli
        name: tsc (packages/cli)
        entry: bun run check:cli
        language: system
        pass_filenames: false
        files: ^packages/cli/

      - id: check-installer
        name: tsc (packages/installer)
        entry: bun run check:installer
        language: system
        pass_filenames: false
        files: ^packages/installer/

      - id: check-docs
        name: svelte-check (packages/docs)
        entry: bun run check:docs
        language: system
        pass_filenames: false
        files: ^(packages/docs/|scripts/docs\.ts$)

  # The CLAUDE.md conventions no linter knows about. Each of these is at zero
  # occurrences today, so they are guards against regression, not a cleanup
  # backlog.
  - repo: local
    hooks:
      - id: no-manual-route-typing
        name: "route files: no manual $props()/load/actions typing (./$types is inferred)"
        language: pygrep
        entry: |-
          (: (PageData|PageProps|LayoutData|ActionData|LayoutProps|PageServerLoad|LayoutServerLoad|Actions|RequestHandler)\b|from "\./\$types")
        files: ^src/routes/.*\.(ts|svelte)$

      - id: no-raw-drizzle-in-routes
        name: "route files: no raw Drizzle queries (go through a DTO)"
        language: pygrep
        entry: \bdb\.(select|insert|update|delete)\(
        files: ^src/routes/.*\.ts$

      - id: internal-links-resolve
        name: "internal links go through resolve() from $app/paths"
        language: pygrep
        entry: href="/
        # Scoped to the main app: packages/docs/ is a separate sub-project
        # with its own routing/build, this convention was only verified there.
        files: ^src/.*\.svelte$
