repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: Look for Merge Conflicts

      - id: check-case-conflict
        name: Look for case conflicts

      - id: check-yaml
        name: Validate Yaml

      - id: check-added-large-files
        name: Look for large files

      - id: mixed-line-ending
        name: Fix line endings
        args: [--fix=lf]
        exclude: &generated |-
          (?x)^(
            src/lib/api/v1\.(json|d\.ts)|
            openapi.json|
            \.example\.env|
            drizzle/|
            CHANGELOG\.md|
            bun\.lock
          )

      - id: end-of-file-fixer
        name: Fix end of files
        exclude: *generated

      - id: trailing-whitespace
        name: Fix trailing whitespaces
        args: [--markdown-linebreak-ext=md]
        exclude: *generated

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: Ensure conventional commits
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Look for hardcoded secrets

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        name: Look for typos
        args: [--force-exclude]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint Github Actions

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        name: Lint Docker

  - repo: local
    hooks:
      - id: gen-env
        name: Regenerate .example.env
        entry: bun run gen:env
        language: system
        pass_filenames: false
        files: ^(src/lib/server/config\.defaults\.ts|scripts/generate-env-example\.ts)$

      - id: format-ts
        name: Formatting (TS)
        entry: bun run biome format --write
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css|svelte|html)$

      - id: format-md
        name: Formatting (MD)
        entry: bun run prettier --log-level warn --write
        language: system
        files: \.(md|mdx)$

      - id: markdownlint
        name: Markdown Lint
        entry: bun run markdownlint-cli2 --fix
        language: system
        types: [markdown]

      - id: test-unit
        name: Unit Tests
        entry: bun run test:unit
        language: system
        pass_filenames: false
        files: ^(src/|test\.setup\.ts$|bunfig\.toml$)

  - repo: local
    hooks:
      - id: no-manual-route-typing
        name: "Look for injected inferred types in routes"
        language: pygrep
        entry: |-
          (: (PageData|PageProps|LayoutData|ActionData|LayoutProps|PageServerLoad|LayoutServerLoad|Actions|RequestHandler)\b|from "\./\$types")
        files: ^src/routes/.*\.(ts|svelte)$

      - id: no-raw-drizzle-in-routes
        name: "Make sure DTOs are used in routes, not drizzle directly"
        language: pygrep
        entry: \bdb\.(select|insert|update|delete)\(
        files: ^src/routes/.*\.ts$

      - id: internal-links-resolve
        name: "Make sure all paths are resolved"
        language: pygrep
        entry: href="/
        files: ^src/.*\.svelte$
