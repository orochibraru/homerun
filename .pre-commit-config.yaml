default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
        name: Fix line endings
        args: [--fix=lf]
        exclude: &generated |-
          (?x)^(
            openapi\.json|
            homerun\.schema\.json|
            tests/integration/support/openapi-types\.ts|
            drizzle/|
            CHANGELOG\.md|
            bun\.lock
          )

      - id: end-of-file-fixer
        name: Fix end of files
        exclude: *generated

      - id: trailing-whitespace
        name: Fix trailing whitespaces
        args: [--markdown-linebreak-ext=md]
        exclude: *generated

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Look for hardcoded secrets

  - repo: local
    hooks:
      - id: bun-fmt
        name: Format (bun fmt)
        entry: bun fmt --ignore-unknown --no-error-on-unmatched-pattern
        language: system
        require_serial: true
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css|svelte|html|md|mdx|ya?ml)$

      - id: format-go
        name: Formatting (Go)
        entry: gofmt -w
        language: system
        files: \.go$
