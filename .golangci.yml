version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
    - whitespace

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G107
        - G110
        - G117
        - G204
        - G301
        - G302
        - G304
        - G306
        - G703
    revive:
      rules:
        - name: exported
          disabled: true
    staticcheck:
      checks:
        - all
        - -ST1005

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - bodyclose
          - errcheck
          - gocritic
          - gosec
          - usestdlibvars

formatters:
  enable:
    - gofmt
