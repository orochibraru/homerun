[run]
bun = true

[test]
preload = [
    "./tests/unit/app/svelte-loader.ts",
    "./tests/unit/support/homedir-preload.ts",
    "./tests/integration/support/setup.ts",
]

# Global test timeout only (whole suite), individual test timeout should be set via cli with --timeout
timeout = 120_000

# Playwright specs (tests/e2e/**) match bun test's own *.spec.ts discovery but
# must only ever run under `playwright test` (bun run test:e2e).
pathIgnorePatterns = ["**/tests/e2e/**"]

coverage = true
coveragePathIgnorePatterns = ["tests/**", "packages/cli/generated/**"]
