name: Pull Request
on:
  pull_request:

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read
  packages: write

# code quality → build (by digest) → e2e against that exact image → tag
# `pr-<number>`. The images are built once and reused, and nothing is published
# under a pullable tag until e2e has passed.
jobs:
  code_quality:
    name: Code Quality
    uses: ./.github/workflows/code_quality.yaml
    secrets: inherit

  binaries:
    name: Binaries
    needs: [code_quality]
    uses: ./.github/workflows/binaries.yaml

  build-app:
    name: Docker Build (App)
    needs: [code_quality]
    uses: ./.github/workflows/docker.yaml
    with:
      image_tag: pr-${{ github.event.pull_request.number }}
      # Forks get no secrets; the build still warms the cache.
      push:
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        }}
      image_name: orochibraru/homerun
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  build-agent:
    name: Docker Build (Agent)
    needs: [code_quality]
    uses: ./.github/workflows/docker.yaml
    with:
      image_tag: pr-${{ github.event.pull_request.number }}
      push:
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        }}
      image_name: orochibraru/homerun-agent
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: agent-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  screenshots:
    name: Screenshots
    needs: [code_quality]
    uses: ./.github/workflows/screenshots.yaml

  e2e:
    name: E2E
    needs: [build-app]
    uses: ./.github/workflows/e2e.yaml
    with:
      image: ${{ needs.build-app.outputs.image }}
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
      pulled:
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        }}
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  publish-app:
    name: Publish App pr-${{ github.event.pull_request.number }}
    needs: [e2e]
    # A fork pushed no digests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/homerun
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  publish-agent:
    name: Publish Agent pr-${{ github.event.pull_request.number }}
    needs: [e2e, build-agent]
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/homerun-agent
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: agent-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  summary:
    name: PR Summary
    if:
      always() && github.event.pull_request.head.repo.full_name ==
      github.repository
    needs:
      - code_quality
      - binaries
      - build-app
      - build-agent
      - screenshots
      - e2e
      - publish-app
      - publish-agent
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the summary comment
        uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const marker = "<!-- homerun-ci-summary -->";
            const needs = JSON.parse(process.env.NEEDS);
            const icons = {
              success: "✅",
              failure: "❌",
              cancelled: "🚫",
              skipped: "⏭️",
            };
            const words = {
              success: "passed",
              failure: "failed",
              cancelled: "cancelled",
              skipped: "skipped",
            };
            const result = (job) => needs[job]?.result ?? "skipped";
            const cell = (status, detail) =>
              `${icons[status] ?? "❔"} ${detail || words[status] || status}`;

            const rows = [
              ["Lint, types, codegen", cell(needs.code_quality?.outputs?.lint ?? result("code_quality"))],
              ["Tests (unit + integration)", cell(needs.code_quality?.outputs?.tests ?? result("code_quality"))],
              ["E2E", cell(result("e2e"), needs.e2e?.outputs?.summary)],
              ["Docs screenshots", cell(result("screenshots"), needs.screenshots?.outputs?.summary)],
              ["Binaries", cell(result("binaries"))],
              ["Docker build", cell(result("build-app"))],
            ];

            const tag = needs["publish-app"]?.outputs?.["image-tag"];
            const appImage = needs["build-app"]?.outputs?.image;
            const agentImage = needs["build-agent"]?.outputs?.image;
            const agentTag = needs["publish-agent"]?.outputs?.["image-tag"];
            const headSha = context.payload.pull_request.head.sha;
            const raw = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${headSha}`;

            const lines = [
              marker,
              "### CI summary",
              "",
              "| Check | Result |",
              "| --- | --- |",
              ...rows.map(([name, value]) => `| ${name} | ${value} |`),
              "",
            ];

            if (result("publish-app") === "success" && tag) {
              lines.push(
                "### Images",
                "",
                "| Image | Tag |",
                "| --- | --- |",
                `| \`${appImage}\` | \`${tag}\` |`,
                ...(result("publish-agent") === "success"
                  ? [`| \`${agentImage}\` | \`${agentTag ?? tag}\` |`]
                  : []),
                "",
                "<details><summary>Try this build</summary>",
                "",
                "```sh",
                `curl -fsSLO ${raw}/compose.prod.yaml`,
                `curl -fsSLO ${raw}/.env.example`,
                "mv .env.example .env && $EDITOR .env",
                "docker network create homerun",
                `HOMERUN_VERSION=${tag} docker compose -f compose.prod.yaml up -d`,
                "```",
                "",
                "Set `AUTH_SECRET` and `ORIGIN` in `.env` first, the stack refuses to start without them.",
                "",
                "</details>",
                "",
              );
            } else {
              lines.push(
                "### Images",
                "",
                "Nothing published for this run : images are only tagged once E2E passes.",
                "",
              );
            }

            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            lines.push(`<sub>${headSha.slice(0, 7)} · <a href="${run}">workflow run</a></sub>`);

            const body = lines.join("\n");
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              });
            }

  gate:
    name: CI Gate
    if: always()
    needs:
      - code_quality
      - binaries
      - build-app
      - build-agent
      - screenshots
      - e2e
      - publish-app
      - publish-agent
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=(
            "${{ needs.code_quality.result }}"
            "${{ needs.binaries.result }}"
            "${{ needs.build-app.result }}"
            "${{ needs.build-agent.result }}"
            "${{ needs.screenshots.result }}"
            "${{ needs.e2e.result }}"
            "${{ needs.publish-app.result }}"
            "${{ needs.publish-agent.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All checks passed (skipped jobs are OK)"
