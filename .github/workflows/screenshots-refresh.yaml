name: Refresh Screenshots

on:
  workflow_dispatch:

concurrency:
  group: screenshots-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Europe/Paris
  CI: true

jobs:
  capture:
    name: Capture
    uses: ./.github/workflows/screenshots.yaml

  commit:
    name: Commit
    needs: [capture]
    runs-on: ubuntu-latest
    env:
      DOCS_TRIGGER_TOKEN: ${{ secrets.DOCS_TRIGGER_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the captured images
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          name: docs-images
          path: docs/images

      - name: Commit them
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git commit -m "chore(docs): refresh screenshots [skip ci]"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger docs build
        if:
          steps.commit.outputs.pushed == 'true' && github.ref_name == 'main' &&
          env.DOCS_TRIGGER_TOKEN != ''
        run: |
          curl -X POST \
            -H "Authorization: token $DOCS_TRIGGER_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/orochibraru/orochibraru/dispatches \
            -d '{"event_type":"docs-update"}'
