name: Screenshots

on:
  workflow_call:
    outputs:
      summary:
        description: "Playwright's own pass/fail counts for this run"
        value: ${{ jobs.screenshots.outputs.summary }}

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  NO_COLOR: "1"

jobs:
  screenshots:
    name: Docs screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      summary: ${{ steps.stats.outputs.summary }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: homerun
          POSTGRES_PASSWORD: homerun
          POSTGRES_DB: homerun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homerun -d homerun_test" --health-interval
          5s --health-timeout 5s --health-retries 20
    env:
      HOMERUN_TEST_POSTGRES_URL: postgres://homerun:homerun@127.0.0.1:5432/homerun_test
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build app from source
        run: bun run build:app

      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium

      - name: Pull the images the seeded services deploy
        run: |
          docker pull nginx:alpine
          docker pull redis:alpine

      - name: Capture
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 20
          retry_on: any
          command: bun run screenshots -- --reporter=list,json

      - name: Summarise the run
        id: stats
        if: always()
        run: |
          if [ -f playwright-results.json ]; then
            jq -r '.stats | "summary=\(.expected) passed" + (if .unexpected > 0 then ", \(.unexpected) failed" else "" end)' \
              playwright-results.json >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the captured images
        uses: orochibraru/upload-artifact@v8
        with:
          name: docs-images
          path: docs/images
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: orochibraru/upload-artifact@v8
        with:
          name: playwright-report-screenshots
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
