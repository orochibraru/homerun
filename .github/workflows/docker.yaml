name: Docker
description: Builds docker images for this app via the Bake conf

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        description: "Subpath and image to push to, example myorg/myimage"
        type: string
      image_tag:
        required: true
        description: "Tag to apply to the built image, e.g. pr-123 or a commit SHA"
        type: string
      registry_name:
        required: true
        description: "Docker registry target to authenticate against and push to"
        type: string
      registry_username:
        required: true
        description: "Docker registry username"
        type: string
    secrets:
      registry_password:
        required: true
    outputs:
      image-tag:
        description: "The primary image tag that was built"
        value: ${{ jobs.merge.outputs.image-tag }}

permissions:
  contents: read

env:
  IMAGE: ${{ inputs.image_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: "Prepare architecture matrix and metadata"
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create matrix
        id: platforms
        run: |
          touch .env
          docker buildx bake image-all --print
          echo "matrix=$(docker buildx bake image-all --print | jq -cr '.target."image-all".platforms')" >>${GITHUB_OUTPUT}

      - name: Show matrix
        run: |
          echo ${{ steps.platforms.outputs.matrix }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Rename meta bake definition file
        run: |
          mv "${{ steps.meta.outputs.bake-file }}" "${{ runner.temp }}/bake-meta.json"

      - name: Upload meta bake definition
        uses: orochibraru/upload-artifact@v8
        with:
          name: bake-meta
          path: ${{ runner.temp }}/bake-meta.json
          if-no-files-found: error
          retention-days: 1

  # ===========================================
  # Docker: Build & push per-platform digests
  # ===========================================
  build:
    name: Build Images
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Download meta bake definition
        uses: orochibraru/download-artifact@v8
        with:
          name: bake-meta
          path: ${{ runner.temp }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - uses: actions/checkout@v6

      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry_name }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Build
        id: bake
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ runner.temp }}/bake-meta.json
          targets: image
          set: |
            *.tags=${{ inputs.image_name }}
            *.platform=${{ matrix.platform }}
            *.output=type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ fromJSON(steps.bake.outputs.metadata).image['containerimage.digest'] }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: orochibraru/upload-artifact@v8
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ===========================================
  # Merge per-platform digests into a manifest
  # ===========================================
  merge:
    name: Create Manifest and Tag then Push
    runs-on: ubuntu-latest
    needs: [prepare, build]
    outputs:
      image-tag: ${{ steps.inspect.outputs.tag }}
    steps:
      - name: Download meta bake definition
        uses: orochibraru/download-artifact@v8
        with:
          name: bake-meta
          path: ${{ runner.temp }}

      - name: Download digests
        uses: orochibraru/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry_name }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.target."docker-metadata-action".tags | map("-t " + .) | join(" ")' "$RUNNER_TEMP/bake-meta.json") \
            $(printf '${{ inputs.image_name }}@sha256:%s ' *)

      - name: Inspect image
        id: inspect
        run: |
          tag=$(jq -r '.target."docker-metadata-action".args.DOCKER_META_VERSION' ${{ runner.temp }}/bake-meta.json)
          echo "tag=$tag" >> $GITHUB_OUTPUT
          docker buildx imagetools inspect ${{ inputs.image_name }}:$tag
