name: Nightly
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download the agnix binary
        run: node node_modules/agnix/install.js

      - name: Sync SvelteKit
        run: bun run svelte-kit sync

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          SKIP: gen,oxlint,markdownlint,lint-tailwind,test-unit,check
        with:
          extra-args: --all-files --no-fail-fast

  version:
    name: Compute Nightly Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Dry-run release to compute the next version
        id: releaser
        uses: orochibraru/releaser@f4e670849b608549cd6ac88d32eeb41cab364709 # v1.7.1
        with:
          branch: main
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch
          dry-run: "true"

      - name: Resolve the nightly version
        id: compute
        env:
          VERSION: ${{ steps.releaser.outputs.version }}
        run: |
          base="${VERSION:-$(jq -r .version package.json)}"
          build="$(git rev-list --count HEAD)"
          echo "version=$base-nightly.$build" >> "$GITHUB_OUTPUT"

  build-app:
    name: Docker Build (App)
    uses: ./.github/workflows/docker.yaml
    needs: [version]
    with:
      app_version: ${{ needs.version.outputs.version }}
      image_tag: nightly
      image_name: orochibraru/homerun
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  build-worker:
    name: Docker Build (Worker)
    uses: ./.github/workflows/docker.yaml
    needs: [version]
    with:
      app_version: ${{ needs.version.outputs.version }}
      image_tag: nightly
      image_name: orochibraru/homerun-worker
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: worker-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  binaries:
    name: Binaries
    uses: ./.github/workflows/binaries.yaml
    needs: [version]
    with:
      version: ${{ needs.version.outputs.version }}
      artifact: nightly-binaries

  release:
    name: Nightly Release
    runs-on: ubuntu-latest
    needs:
      - prek
      - version
      - build-app
      - build-worker
      - binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download app digests
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          path: ${{ runner.temp }}/digests/app
          pattern: digests-app-ci-*
          merge-multiple: true

      - name: Download worker digests
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          path: ${{ runner.temp }}/digests/worker
          pattern: digests-worker-ci-*
          merge-multiple: true

      - name: Download binaries
        uses: orochibraru/download-artifact@554003634ca680409ecdbf97e0de85a6002f420b # 8.0.2
        with:
          name: nightly-binaries
          path: dist

      - name: Login to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: orochibraru
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tag the images nightly
        run: |
          set -euo pipefail
          for pair in app:homerun worker:homerun-worker; do
            image="docker.io/orochibraru/${pair#*:}"
            sources=()
            for digest in "$RUNNER_TEMP/digests/${pair%%:*}"/*; do sources+=("$image@sha256:$(basename "$digest")"); done
            docker buildx imagetools create -t "$image:nightly" "${sources[@]}"
          done
          docker buildx imagetools inspect docker.io/orochibraru/homerun:nightly

      - name: Publish the nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --draft --prerelease --target "$SHA" \
            --title "Nightly $VERSION" \
            --notes "Nightly build of $SHA: prek passed, nothing else ran. It may be broken. Run it with HOMERUN_VERSION=nightly."
          bun scripts/upload-release-assets.ts "v$VERSION" --prerelease
          gh release list --limit 100 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease and (.tagName | contains("-nightly.")))] | .[5:] | .[].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
