name: CI
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  checks:
    name: TypeScript Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for tooling
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate SvelteKit types
        run: |
          echo "Generating SvelteKit types..."
          if bun run svelte-kit sync; then
              echo "SvelteKit types generated successfully."
          else
              echo "Failed to generate SvelteKit types."
              exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Type check Webapp
        run: bun run svelte-check --tsconfig ./tsconfig.json --fail-on-warnings --tsgo

      - name: Type check Agent
        run: bun run check:agent

      - name: Type check CLI
        run: bun run check:cli

      - name: Type check Installer
        run: bun run check:installer

      - name: Build Webapp
        run: bun run build:app
