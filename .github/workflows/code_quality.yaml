name: CI
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  markdown:
    name: Markdown Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for tooling
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check markdown linting
        run: bun run lint:md

      - name: Check markdown formatting
        run: bun run format:md:check

  ts:
    name: TypeScript Build & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate SvelteKit types
        run: |
          echo "Generating SvelteKit types..."
          if bun run svelte-kit sync; then
              echo "SvelteKit types generated successfully."
          else
              echo "Failed to generate SvelteKit types."
              exit 1
          fi

      - name: Type check Webapp
        run:
          bun run svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
          --tsgo

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Type check Packages
        run: |
          bun run check:agent
          bun run check:cli
          bun run check:installer
