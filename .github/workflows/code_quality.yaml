name: Code Quality
on:
  workflow_call:

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"
  COLUMNS: "9999"
  NO_COLOR: "1"

jobs:
  lint:
    name: Linting / Formatting / Type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      # The hooks shell out to the repo's own tooling (bun run gen, bunx
      # biome/prettier/markdownlint/tailwint), so deps have to exist first.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Same .pre-commit-config.yaml the local pre-commit hook runs: actionlint,
      # biome, prettier + markdownlint on markdown, tailwint, a regen of the
      # derived openapi/CLI-types/config-schema files, and svelte-check/tsc over
      # the app and every sub-project. The fixer hooks autofix in place, so CI
      # fails on any file one of them had to modify, with the diff printed.
      - name: Run prek
        uses: j178/prek-action@v3.0.0

  ts-test:
    name: Tests (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install socat
        run: sudo apt-get update && sudo apt-get install -y socat

      - name: Build app
        run: bun run build:app

      - name: Tests (Unit)
        run:
          bun run test:unit -- --coverage-reporter=lcov
          --coverage-dir=coverage/unit

      - name: Tests (Integration)
        run:
          bun run test:integration -- --coverage-reporter=lcov
          --coverage-dir=coverage/integration

      - name: Upload coverage report
        if: always()
        uses: orochibraru/upload-artifact@v8
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Tests (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build App
        run: bun run build:app

      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium

      - name: Tests (E2E)
        run: bun run test:e2e
