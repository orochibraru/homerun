name: Publish
on:
  push:
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read
  packages: write

jobs:
  code_quality:
    name: Code Quality
    uses: ./.github/workflows/code_quality.yaml

  build:
    name: Docker Build
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
    with:
      image_tag: ${{ github.sha }}
      image_name: orochibraru/homerun
      registry_name: git.ombrage.space
      registry_username: orochibraru
      bake_target: app
    secrets:
      registry_password: ${{ secrets.PACKAGES_TOKEN }}

  build_agent:
    name: Docker Build (Agent)
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
    with:
      image_tag: ${{ github.sha }}
      image_name: orochibraru/homerun-agent
      registry_name: git.ombrage.space
      registry_username: orochibraru
      bake_target: agent
    secrets:
      registry_password: ${{ secrets.PACKAGES_TOKEN }}

  binaries:
    name: Binaries
    uses: ./.github/workflows/binaries.yaml
    needs:
      - code_quality

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - code_quality
      - build
      - build_agent
      - binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download binaries
        uses: orochibraru/download-artifact@v8
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Release
        env:
          GITEA_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GITEA_URL: https://git.ombrage.space

        run: bun run release

      - name: Check for new release tag
        id: released
        run: |
          git fetch --tags origin main
          git checkout main
          git reset --hard origin/main
          TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.released.outputs.tag != ''
        uses: docker/setup-buildx-action@v4

      - name: Login to Container registry
        if: steps.released.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          registry: git.ombrage.space
          username: orochibraru
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Tag latest image with release version
        if: steps.released.outputs.tag != ''
        run: |
          docker buildx imagetools create \
            -t git.ombrage.space/orochibraru/homerun:${{ steps.released.outputs.tag }} \
            git.ombrage.space/orochibraru/homerun:latest

      - name: Tag latest agent image with release version
        if: steps.released.outputs.tag != ''
        run: |
          docker buildx imagetools create \
            -t git.ombrage.space/orochibraru/homerun-agent:${{ steps.released.outputs.tag }} \
            git.ombrage.space/orochibraru/homerun-agent:latest
