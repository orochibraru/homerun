name: Publish
on:
  push:
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read
  packages: write

jobs:
  code_quality:
    name: Code Quality
    uses: ./.github/workflows/code_quality.yaml

  version:
    name: Compute Release Version
    runs-on: ubuntu-latest
    needs:
      - code_quality
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Dry-run release to compute the next version
        id: compute
        env:
          GITEA_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GITEA_URL: https://git.ombrage.space
        run: |
          output="$(bunx semantic-release --dry-run 2>&1)" || true
          echo "$output"
          version="$(echo "$output" | grep -oE 'release version is [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1)"
          if [ -n "$version" ]; then
            echo "This push will release v$version, tagging images and binaries accordingly."
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "No release-worthy commits, falling back to the commit SHA for image tags; binaries keep the last released version."
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Docker Build
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
      - version
    with:
      image_tag: ${{ needs.version.outputs.tag }}
      image_name: orochibraru/homerun
      registry_name: git.ombrage.space
      registry_username: orochibraru
      bake_target: app
    secrets:
      registry_password: ${{ secrets.PACKAGES_TOKEN }}

  build_agent:
    name: Docker Build (Agent)
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
      - version
    with:
      image_tag: ${{ needs.version.outputs.tag }}
      image_name: orochibraru/homerun-agent
      registry_name: git.ombrage.space
      registry_username: orochibraru
      bake_target: agent
    secrets:
      registry_password: ${{ secrets.PACKAGES_TOKEN }}

  binaries:
    name: Binaries
    uses: ./.github/workflows/binaries.yaml
    needs:
      - code_quality
      - version
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - code_quality
      - version
      - build
      - build_agent
      - binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download binaries
        uses: orochibraru/download-artifact@v8
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Release
        env:
          GITEA_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GITEA_URL: https://git.ombrage.space

        run: bun run release
