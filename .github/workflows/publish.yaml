name: Publish
on:
  push:
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris

permissions:
  contents: read
  packages: write

jobs:
  code_quality:
    name: Code Quality
    uses: ./.github/workflows/code_quality.yaml

  build:
    name: Docker Build
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
    with:
      image_tag: ${{ github.sha }}
      image_name: orochibraru/homerun
      registry_name: git.ombrage.space
      registry_username: orochibraru
    secrets:
      registry_password: ${{ secrets.PACKAGES_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - code_quality
    # semantic-release itself decides whether a conventional-commit-worthy
    # release actually happened (a chore/docs-only push is a no-op, not an
    # error) — this job always runs, `bun run release` is what's
    # conditional. Uses @saithodev/semantic-release-gitea, not the official
    # GitHub plugin — this repo's origin is a self-hosted Gitea
    # (git.ombrage.space, same one docker.yaml already pushes images to),
    # not GitHub, even though workflow files live under .github/workflows/
    # for Gitea Actions' GitHub-Actions-compatible workflow format.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GITEA_TOKEN reuses the same PACKAGES_TOKEN docker.yaml already has
      # configured for pushing to git.ombrage.space — unverified whether
      # that token's scopes cover the Gitea *release* API (as opposed to
      # just package/registry push) since this couldn't be tested against
      # the real Gitea instance from here. If release creation 403s, mint a
      # dedicated token with repo write access and point GITEA_TOKEN at a
      # new secret instead of reusing PACKAGES_TOKEN.
      - name: Release
        env:
          GITEA_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GITEA_URL: https://git.ombrage.space
        run: bun run release
