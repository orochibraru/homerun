name: Publish
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    name: Resolve Merged PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      promote: ${{ steps.resolve.outputs.promote }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Find the PR and whether its images can be promoted
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "promote=false" >> "$GITHUB_OUTPUT"

          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -z "$pr" ]; then
            echo "Direct push, no PR to promote from: building from scratch."
            exit 0
          fi

          head="$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')"
          git fetch --quiet origin "refs/pull/$pr/head"
          drift="$(git diff --name-only "$head" "$SHA" -- . ':(exclude)CHANGELOG.md' ':(exclude)package.json')"
          if [ -n "$drift" ] || [ "$(git show "$head:package.json" | jq -S 'del(.version)')" != "$(git show "$SHA:package.json" | jq -S 'del(.version)')" ]; then
            echo "PR #$pr differs from this commit beyond a release bump, so its images don't match: building from scratch."
            echo "$drift"
            exit 0
          fi

          gate="$(gh api "repos/$REPO/commits/$head/check-runs?check_name=CI%20Gate" --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [ "$gate" = "0" ]; then
            echo "CI Gate never passed on PR #$pr's head $head: building from scratch."
            exit 0
          fi

          for image in homerun homerun-worker; do
            if ! docker buildx imagetools inspect "docker.io/orochibraru/$image:pr-$pr" > /dev/null 2>&1; then
              echo "docker.io/orochibraru/$image:pr-$pr doesn't exist: building from scratch."
              exit 0
            fi
          done

          echo "Promoting PR #$pr's already-tested images instead of rebuilding."
          echo "promote=true" >> "$GITHUB_OUTPUT"

  code_quality:
    name: Code Quality
    needs: [resolve]
    if: needs.resolve.outputs.promote != 'true'
    uses: ./.github/workflows/code_quality.yaml
    secrets: inherit

  go:
    name: Go
    needs: [resolve]
    if: needs.resolve.outputs.promote != 'true'
    uses: ./.github/workflows/go.yaml
    secrets: inherit

  version:
    name: Compute Release Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Dry-run release to compute the next version
        id: releaser
        uses: orochibraru/releaser@5acaa4888249154fe1b45735576a9eeff030a6d8 # v1.4.0
        with:
          branch: main
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch
          dry-run: "true"

      - name: Resolve image tag
        id: compute
        env:
          VERSION: ${{ steps.releaser.outputs.version }}
          TAG: ${{ steps.releaser.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "This push will release $TAG, tagging images and binaries accordingly."
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No release-worthy commits, falling back to the commit SHA for image tags; binaries keep the last released version."
            echo "tag=$SHA" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Docker Build (App)
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
      - go
      - version
    with:
      app_version: ${{ needs.version.outputs.version }}
      image_tag: ${{ needs.version.outputs.tag }}
      image_name: orochibraru/homerun
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  build-worker:
    name: Docker Build (Worker)
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
      - go
      - version
    with:
      app_version: ${{ needs.version.outputs.version }}
      image_tag: ${{ needs.version.outputs.tag }}
      image_name: orochibraru/homerun-worker
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: worker-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  binaries:
    name: Binaries
    uses: ./.github/workflows/binaries.yaml
    needs:
      - code_quality
      - go
      - version
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    with:
      version: ${{ needs.version.outputs.version }}

  e2e:
    name: E2E
    needs: [build-app]
    uses: ./.github/workflows/e2e.yaml
    with:
      image: ${{ needs.build-app.outputs.image }}
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  publish-app:
    name: Publish App ${{ needs.version.outputs.tag }}
    needs: [version, e2e]
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/homerun
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  publish-worker:
    name: Publish Worker ${{ needs.version.outputs.tag }}
    needs: [version, e2e, build-worker]
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/homerun-worker
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: worker-ci
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  promote:
    name:
      Promote pr-${{ needs.resolve.outputs.pr }} to ${{
      needs.version.outputs.tag }}
    needs: [resolve, version]
    if: needs.resolve.outputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: orochibraru
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tag the tested images
        env:
          PR: ${{ needs.resolve.outputs.pr }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          app=docker.io/orochibraru/homerun
          printf 'FROM %s:pr-%s\nENV HOMERUN_APP_VERSION=%s\n' "$app" "$PR" "$VERSION" \
            | docker buildx build --platform linux/amd64,linux/arm64 -t "$app:$TAG" -t "$app:latest" --push -
          docker buildx imagetools inspect "$app:$TAG"
          worker=docker.io/orochibraru/homerun-worker
          docker buildx imagetools create -t "$worker:$TAG" -t "$worker:latest" "$worker:pr-$PR"
          docker buildx imagetools inspect "$worker:$TAG"

  cleanup:
    name: PR Cleanup
    needs: [resolve, promote, publish-app, publish-worker]
    if:
      ${{ !cancelled() && needs.resolve.outputs.pr != '' &&
      !contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/delete-pr-images.yaml
    with:
      pr_number: ${{ needs.resolve.outputs.pr }}
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - code_quality
      - go
      - version
      - build-app
      - build-worker
      - binaries
      - e2e
      - publish-app
      - publish-worker
      - promote
    if:
      ${{ !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.promote.result == 'success' || (needs.publish-app.result ==
      'success' && needs.publish-worker.result == 'success')) }}
    permissions:
      contents: write
    steps:
      # RELEASE_TOKEN (a fine-grained PAT scoped to just this repo, Contents:
      # write) is required, not the default GITHUB_TOKEN: the `main` ruleset
      # blocks direct pushes from anyone but a repo admin, and the default
      # token's actor (github-actions[bot]) isn't on the bypass list. releaser
      # pushes the release commit and tag over this checkout's credentials.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download binaries
        uses: orochibraru/download-artifact@f4f92658c2471fe1dd133b163218066198a0a395 # v8
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Release
        id: releaser
        uses: orochibraru/releaser@5acaa4888249154fe1b45735576a9eeff030a6d8 # v1.4.0
        with:
          branch: main
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch
          prepare: bunx prettier --write CHANGELOG.md
          draft: "true"
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload binaries and publish the release
        if: steps.releaser.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.releaser.outputs.tag }}
        run: bun scripts/upload-release-assets.ts "$TAG"
