name: Publish
on:
  push:
    branches:
      - main

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris

permissions:
  contents: read
  packages: write

jobs:
  code_quality:
    name: Code Quality
    uses: ./.github/workflows/code_quality.yaml

  build:
    name: Docker Build
    uses: ./.github/workflows/docker.yaml
    needs:
      - code_quality
    with:
      image_tag: ${{ github.sha }}
      image_name: orochibraru/homerun
      registry_name: git.ombrage.space
      registry_username: orochibraru
    secrets:
      registry_password: ${{ secrets.PACKAGES_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - code_quality
      - build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release
        env:
          GITEA_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GITEA_URL: https://git.ombrage.space
        run: bun run release
