name: Release
on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Canary
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.canary.outputs.sha }}
      tag: ${{ steps.releaser.outputs.tag }}
      version: ${{ steps.releaser.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check canary is main
        id: canary
        run: |
          set -euo pipefail
          git fetch --quiet --force origin 'refs/tags/canary:refs/tags/canary'
          sha="$(git rev-parse 'canary^{commit}')"
          drift="$(git diff --name-only "$sha" HEAD -- . ':(glob,exclude)docs/**' ':(glob,exclude)**/*.md' ':(glob,exclude).agents/**' ':(glob,exclude).claude/**')"
          if [ -n "$drift" ]; then
            echo "::error::main has changes the canary ($sha) wasn't built from. Wait for Publish to finish, then run this again."
            echo "$drift"
            exit 1
          fi
          echo "Promoting canary $sha."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Dry-run release to compute the version
        id: releaser
        uses: orochibraru/releaser@5acaa4888249154fe1b45735576a9eeff030a6d8 # v1.4.0
        with:
          branch: main
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch
          dry-run: "true"

      - name: Fail when there's nothing to release
        if: steps.releaser.outputs.version == ''
        run: |
          echo "::error::No release-worthy commits since the last release."
          exit 1

  binaries:
    name: Binaries
    needs: [resolve]
    uses: ./.github/workflows/binaries.yaml
    with:
      version: ${{ needs.resolve.outputs.version }}

  images:
    name: Promote Images to ${{ needs.resolve.outputs.tag }}
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: orochibraru
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tag the canary images
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          app=docker.io/orochibraru/homerun
          printf 'FROM %s:%s\nENV HOMERUN_APP_VERSION=%s\n' "$app" "$SHA" "$VERSION" \
            | docker buildx build --platform linux/amd64,linux/arm64 -t "$app:$TAG" -t "$app:latest" -t "$app:canary" --push -
          docker buildx imagetools inspect "$app:$TAG"
          worker=docker.io/orochibraru/homerun-worker
          docker buildx imagetools create -t "$worker:$TAG" -t "$worker:latest" -t "$worker:canary" "$worker:$SHA"
          docker buildx imagetools inspect "$worker:$TAG"

  release:
    name: Release ${{ needs.resolve.outputs.tag }}
    needs: [resolve, binaries, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download binaries
        uses: orochibraru/download-artifact@f4f92658c2471fe1dd133b163218066198a0a395 # v8
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Release
        id: releaser
        uses: orochibraru/releaser@5acaa4888249154fe1b45735576a9eeff030a6d8 # v1.4.0
        with:
          branch: main
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch
          prepare: bunx prettier --write CHANGELOG.md
          draft: "true"
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload binaries and publish the release
        if: steps.releaser.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.releaser.outputs.tag }}
        run: bun scripts/upload-release-assets.ts "$TAG"
