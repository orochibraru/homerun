name: Binaries
# Builds the agent/cli/installer standalone binaries, one arch per matrix leg,
# natively on a GitHub-hosted runner of that arch.

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ""
        description:
          "Version to bake into the built binaries (bare X.Y.Z, no leading v,
          same value cli/agent/version.ts reads from package.json at compile
          time). Empty means this push isn't releasing, so the binaries build
          with whatever version is already committed."

permissions:
  contents: read

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Bun binaries (agent, installer) are built natively per arch;
          # the Go CLI cross-compiles, so the amd64 leg also produces both
          # macOS ones and no macOS runner is needed at all.
          - arch: amd64
            targets: amd64 darwin-amd64 darwin-arm64
            runner: ubuntu-latest
          - arch: arm64
            targets: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump version for this build
        if: inputs.version != ''
        run: bun scripts/bump-version.ts ${{ inputs.version }}

      - name: Build binaries
        run: bun run scripts/build-packages.ts ${{ matrix.targets }}

      - name: Upload binaries
        uses: orochibraru/upload-artifact@v8
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
