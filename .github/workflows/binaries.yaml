name: Binaries

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ""
        description:
          "Version to bake into the built binaries (bare X.Y.Z, no leading v,
          stamped into internal/buildinfo from package.json at compile time).
          Empty means this push isn't releasing, so the binaries build
          with whatever version is already committed."

permissions:
  contents: read

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump version for this build
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Build binaries
        run: bun run scripts/build-packages.ts

      - name: Upload binaries
        uses: orochibraru/upload-artifact@aeca548ce375fd719f0400e020a3ad90509632bc # v8.0.1
        with:
          name: binaries-all
          path: dist/*
          if-no-files-found: error
          retention-days: 1
