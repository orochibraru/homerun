name: Binaries

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ""
        description:
          "Version to bake into the built binaries (bare X.Y.Z, no leading v,
          same value cli/agent/version.ts reads from package.json at compile
          time). Empty means this push isn't releasing, so the binaries build
          with whatever version is already committed."

permissions:
  contents: read

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump version for this build
        if: inputs.version != ''
        run: bun scripts/bump-version.ts ${{ inputs.version }}

      - name: Build binaries
        run: bun run scripts/build-packages.ts

      - name: Upload binaries
        uses: orochibraru/upload-artifact@v8
        with:
          name: binaries-all
          path: dist/*
          if-no-files-found: error
          retention-days: 1
