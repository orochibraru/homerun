name: Go

on:
  workflow_call:
    outputs:
      result:
        description: "Result of the Go test + lint jobs"
        value: ${{ jobs.test.outputs.result }}

permissions:
  contents: read

env:
  TZ: Europe/Paris
  CI: "true"
  NO_COLOR: "1"

jobs:
  test:
    name: Tests (Go)
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.done.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -coverprofile=coverage.out ./cmd/... ./internal/... ./tests/unit/go/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./tests/unit/go)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./cmd/... ./internal/... ./tests/unit/go/...

      - name: Record result
        id: done
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "result=$JOB_STATUS" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go/go.sum

      - name: golangci-lint
        run: go tool -modfile=tools/go/go.mod golangci-lint run ./cmd/... ./internal/... ./tests/unit/go/...
